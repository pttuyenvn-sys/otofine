# ====================================================================
# Otofine — wildcard storefront server block (Phase 6A, production)
# ====================================================================
# Drop-in path on the host:
#   /etc/nginx/sites-available/otofine-shop-subdomain.conf
#   sudo ln -s ../sites-available/otofine-shop-subdomain.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file COMPLEMENTS the existing apex `/etc/nginx/sites-enabled/otofine`
# server block. It MUST NOT replace it. The apex block keeps serving
# otofine.com / www.otofine.com because `server_name` matches the most
# specific host. The wildcard block only owns `*.otofine.com`.
#
# Rollback (zero apex impact):
#   sudo rm /etc/nginx/sites-enabled/otofine-shop-subdomain.conf
#   sudo systemctl reload nginx
# ====================================================================

# Shared upstream — same PM2-managed Next.js process the apex block uses.
# Defining it once lets us share the keepalive pool and avoid socket churn.
upstream otofine_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --------------------------------------------------------------------
# 1. HTTP → HTTPS redirect for wildcard subdomains.
# --------------------------------------------------------------------
# The apex http→https redirect lives in the existing apex block.
# Keeping it separate here avoids overlap on otofine.com itself.
server {
    listen 80;
    listen [::]:80;
    server_name *.otofine.com;

    # Stay machine-readable: a 301 with the original Host preserves
    # the subdomain through the redirect.
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------
# 2. HTTPS — wildcard storefront proxy → Next.js.
# --------------------------------------------------------------------
# server_name precedence: nginx prefers exact match over wildcard, so
# requests to `otofine.com` / `www.otofine.com` keep hitting the apex
# server block in /etc/nginx/sites-enabled/otofine. Only OTHER labels
# (`<slug>.otofine.com`) reach this block.
# --------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.otofine.com;

    # ---------- TLS ----------
    # OPTION A (recommended for Phase 6A): Cloudflare proxy + Origin
    # Certificate. Origin cert is free, lasts 15 years, signed by
    # Cloudflare for any *.otofine.com hostname. Visitors see a
    # Cloudflare-signed cert (Universal SSL); the origin sees the
    # Cloudflare-signed origin cert.
    #
    # OPTION B: certbot DNS-01 wildcard (uncomment when not on
    # Cloudflare proxy). See the DNS-01 section at the bottom.
    ssl_certificate     /etc/ssl/otofine/origin.pem;
    ssl_certificate_key /etc/ssl/otofine/origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---------- Hardening ----------
    # Stay quiet about the upstream stack.
    server_tokens off;
    # The default 1m is too small for storefront image uploads even
    # though they're seller-only — match the apex limit.
    client_max_body_size 12m;
    # Storefront-only: a meta robots tag also ships from the layout,
    # but defence-in-depth at the edge is cheap. Removed by ops in
    # Phase 6B once indexing is intentionally enabled.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Don't let a slug subdomain set HSTS — the apex block is the
    # authoritative HSTS source so includeSubDomains there propagates.
    # (intentionally no Strict-Transport-Security header here)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- Compression ----------
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- Reserved labels block ----------
    # These labels must NEVER be served as a shop. The apex / api /
    # admin / rfq labels already have their own server blocks, so this
    # is belt-and-braces against a future misconfiguration where
    # someone forgets to add a dedicated server block for a new
    # reserved label. Keep in sync with backend RESERVED_SHOP_SLUGS
    # (publicShop.config.js) and frontend shopHost.RESERVED_SUBDOMAINS.
    if ($host ~* "^(www|api|admin|rfq|shop|shops|mail|assets|cdn|app|static|img|rfq-img|m|mobile|account|auth|seller|support|help|docs|blog|status|staging|dev|qa|test|preview|next)\.otofine\.com$") {
        return 404;
    }

    # ---------- Slug shape guard ----------
    # Refuse anything that can't be a legal shop slug. Mirrors
    # SUBDOMAIN_SLUG_REGEX in shopHost.js. Rejecting at the edge means
    # malformed hosts never wake the Node process.
    if ($host !~* "^[a-z0-9](?:[a-z0-9\-]{1,38}[a-z0-9])\.otofine\.com$") {
        return 404;
    }

    # ---------- API + uploads ----------
    # These paths must remain valid on subdomains too (RSC / Next data
    # / image loader / SSR `fetch` from server components all use the
    # subdomain's API_BASE when configured that way). Same upstream
    # rules as the apex block.
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_body_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Default → Next.js (storefront SSR) ----------
    location / {
        proxy_pass http://otofine_frontend;
        proxy_http_version 1.1;

        # WebSocket / HMR upgrade headers — harmless in prod, required
        # if you ever run `next dev` behind this in staging.
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering    on;
        proxy_read_timeout 60s;
    }
}

# ====================================================================
# DNS — what to add at Cloudflare for *.otofine.com
# ====================================================================
#
#   Type     Name   Content       Proxy
#   -----    -----  ------------  --------
#   CNAME    *      otofine.com   Proxied (orange cloud)
#
# Propagation: <5 minutes through Cloudflare DNS.
#
# Rollback: change the proxy mode to "DNS only" (grey cloud) OR
# delete the CNAME row. Apex `otofine.com` A record is untouched, so
# the apex stays up either way.
#
# ====================================================================
# Wildcard TLS — alternatives if Cloudflare proxy isn't an option
# ====================================================================
#
# DNS-01 wildcard cert via certbot + Cloudflare DNS API (only DNS-01
# works for `*.otofine.com` — HTTP-01 cannot prove a wildcard):
#
#   sudo apt install python3-certbot-dns-cloudflare
#
#   # /etc/letsencrypt/cloudflare.ini  (chmod 600)
#   dns_cloudflare_api_token = <Zone.DNS:Edit token for otofine.com>
#
#   sudo certbot certonly \
#     --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     --dns-cloudflare-propagation-seconds 60 \
#     -d 'otofine.com' -d '*.otofine.com' \
#     --cert-name otofine.com-wild \
#     --preferred-challenges dns-01
#
# Then point this block at the new cert:
#
#   ssl_certificate     /etc/letsencrypt/live/otofine.com-wild/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/otofine.com-wild/privkey.pem;
#
# Certbot's systemd timer renews on the same schedule as your apex
# cert; the renewal hook reloads nginx automatically.
