# --------------------------------------------------------------------
# Otofine — wildcard shop subdomain reverse-proxy
# --------------------------------------------------------------------
# EXAMPLE FILE ONLY. Do NOT replace your production apex config
# (which terminates otofine.com / www.otofine.com / api.otofine.com).
#
# This file documents the *additional* server blocks needed to route
# https://<slug>.otofine.com to the same Next.js process that serves
# apex. The Next.js middleware (frontend/middleware.js) then rewrites
# the request internally to /shops/<slug>.
#
# Drop-in path on the host:
#   /etc/nginx/sites-available/otofine-shop-subdomain.conf
#   sudo ln -s ../sites-available/otofine-shop-subdomain.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Rollback:
#   sudo rm /etc/nginx/sites-enabled/otofine-shop-subdomain.conf
#   sudo systemctl reload nginx
#   (apex config is untouched, so apex traffic is unaffected.)
#
# --------------------------------------------------------------------

# Upstream — adjust the port to whatever PM2 binds the Next.js process to.
upstream otofine_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --------------------------------------------------------------------
# Default server — absorb traffic for unknown hostnames so attackers
# can't fish for misconfigured subdomains. `444` = no response, close
# the connection. This is recommended by the Nginx docs for catch-all.
# --------------------------------------------------------------------
server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name _;

    # Same wildcard cert as the *.otofine.com block below.
    ssl_certificate     /etc/letsencrypt/live/otofine.com-wild/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otofine.com-wild/privkey.pem;

    return 444;
}

# --------------------------------------------------------------------
# Wildcard shop subdomains — *.otofine.com
# --------------------------------------------------------------------
# IMPORTANT: this block MUST NOT match `otofine.com` or
# `www.otofine.com` (those keep their existing apex server blocks
# with `server_name otofine.com www.otofine.com;`).
#
# Nginx picks the most specific server_name match, so the apex blocks
# win for the literal apex hosts.
# --------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name *.otofine.com;

    # Wildcard TLS — see "DNS-01 / wildcard certificate" section below.
    ssl_certificate     /etc/letsencrypt/live/otofine.com-wild/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otofine.com-wild/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS only on apex hosts in production; subdomains piggyback via
    # `includeSubDomains`. Keep this block off so the apex stays the
    # authoritative source.
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # The 4 shop-tenant pages return text/html. Compress everything.
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Pass the original Host header so the Next.js middleware can read
    # `<slug>.otofine.com` and decide whether to rewrite.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_http_version 1.1;
    proxy_buffering    on;
    proxy_read_timeout 60s;

    # Reserved subdomains that this server block must NOT serve. If
    # any of these ever hit this block (because the more specific
    # apex/api/admin blocks above didn't catch them), return 404 to
    # prevent confusion with a shop slug of the same name. Mirrors
    # frontend/lib/shopHost.js RESERVED_SUBDOMAINS.
    # Keep in sync with backend RESERVED_SHOP_SLUGS (publicShop.config.js).
    if ($host ~* "^(www|api|admin|rfq|shop|shops|mail|assets|cdn|app|static|img|rfq-img|m|mobile|account|auth|seller|support|help|docs|blog|status|staging|dev|qa|test|preview|next)\.otofine\.com$") {
        return 404;
    }

    location / {
        proxy_pass http://otofine_frontend;
    }

    # Disable indexing at the edge as a belt-and-braces match for the
    # `noindex,nofollow` <meta> emitted by the shop-tenant layout.
    # Remove this header in Phase 4 once canonicals / sitemap are live.
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# --------------------------------------------------------------------
# Optional HTTP→HTTPS redirect (only if you don't already have one
# globally). Skip if your existing apex config already handles :80.
# --------------------------------------------------------------------
# server {
#     listen      80 default_server;
#     listen      [::]:80 default_server;
#     server_name *.otofine.com;
#     return 301 https://$host$request_uri;
# }

# --------------------------------------------------------------------
# DNS-01 / wildcard certificate (Cloudflare strategy)
# --------------------------------------------------------------------
# *.otofine.com cannot be validated by Let's Encrypt over HTTP-01.
# Use DNS-01 instead. Recommended automation:
#
#   1. Generate a Cloudflare API token with `Zone.DNS:Edit` for the
#      otofine.com zone only.
#   2. Save it to /etc/letsencrypt/cloudflare.ini (chmod 600):
#        dns_cloudflare_api_token = XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#   3. Install: apt install python3-certbot-dns-cloudflare
#   4. Request the wildcard:
#        sudo certbot certonly \
#          --dns-cloudflare \
#          --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#          --dns-cloudflare-propagation-seconds 60 \
#          -d 'otofine.com' -d '*.otofine.com' \
#          --cert-name otofine.com-wild \
#          --preferred-challenges dns-01
#   5. Cron renewal works automatically — certbot stores the auth hook.
#
# If you already terminate TLS at Cloudflare (orange-cloud / proxied),
# you can use Cloudflare's Universal SSL which covers *.otofine.com
# out of the box — no certbot needed. In that case set the origin
# Nginx blocks to `listen 80;` (plaintext) and bind Cloudflare to
# origin via Full (strict) mode with a Cloudflare Origin Certificate.
#
# --------------------------------------------------------------------
# DNS record
# --------------------------------------------------------------------
#   Type:   CNAME (or A)
#   Name:   *
#   Target: otofine.com  (or the apex A record IP)
#   Proxy:  enabled (orange cloud) for free TLS + DDoS
#
# Propagation: <5 minutes via Cloudflare DNS.
